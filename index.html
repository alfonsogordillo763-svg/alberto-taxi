<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alberto Taxi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">

  <header>
    <div class="roof-light">ALBERTO TAXI</div>
    <div class="tagline">Servicio de taxi · disponible las 24 horas</div>
  </header>

  <a class="call-plate" href="tel:+34614157293" id="callPlate">
    <div class="label">Llamar ahora</div>
    <div class="number" id="phoneDisplay">614 15 72 93</div>
    <div class="hint">Toca para llamar</div>
  </a>

  <section>
    <h2>Valoración media</h2>
    <div class="avg-row">
      <div class="avg-number" id="avgNumber">–</div>
      <div class="avg-meta">
        <div class="avg-stars" id="avgStars">☆☆☆☆☆</div>
        <div class="avg-count" id="avgCount">Sin reseñas todavía</div>
      </div>
    </div>
  </section>

  <section>
    <h2>Deja tu reseña</h2>
    <form id="reviewForm">
      <label class="field-label" for="nameInput">Tu nombre</label>
      <input type="text" id="nameInput" placeholder="Ej. María" maxlength="40" required>

      <label class="field-label">Puntuación</label>
      <div class="star-picker" id="starPicker">
        <span data-value="1">★</span>
        <span data-value="2">★</span>
        <span data-value="3">★</span>
        <span data-value="4">★</span>
        <span data-value="5">★</span>
      </div>

      <label class="field-label" for="commentInput">Comentario (opcional)</label>
      <textarea id="commentInput" placeholder="Cuéntanos qué tal el servicio" maxlength="300"></textarea>

      <button type="submit" class="submit-btn" id="submitBtn">Enviar reseña</button>
      <div class="form-msg" id="formMsg"></div>
    </form>
  </section>

  <section>
    <h2>Reseñas de clientes</h2>
    <div id="reviewsList">
      <div class="empty-state">Cargando reseñas…</div>
    </div>
  </section>

  <footer>Alberto Taxi</footer>
</div>

<a class="whatsapp-float" id="whatsappBtn" href="https://wa.me/34614157293" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">

</a>

</body>
</html>
